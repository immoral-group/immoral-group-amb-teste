<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototipo - Agujero Negro</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #fff;
        }

        canvas {
            display: block;
        }

        #scene-wrapper {
            position: fixed;
            inset: 0;
            transform-origin: center center;
            transition: transform 0.6s ease;
        }

        body.is-hover #scene-wrapper {
            transform: scale(1.12);
        }

        #reveal-mask {
            position: fixed;
            inset: 0;
            z-index: 20;
        }

        #vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 50%, black 150%);
            pointer-events: none;
            z-index: 5;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
        }
    }
    </script>
</head>

<body>
    <div id="vignette"></div>
    <div id="scene-wrapper">
        <canvas id="reveal-mask"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(18, 82, 18); // vista casi cenital, como en la referencia

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        const sceneWrapper = document.getElementById('scene-wrapper');
        sceneWrapper.insertBefore(renderer.domElement, document.getElementById('reveal-mask'));

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.03;
        controls.autoRotate = false; // cámara fija en el encuadre inicial (top-down), sin ir a la deriva

        const noiseChunk = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
            const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 = v - i + dot(i, C.xxx) ;
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }
    `;

        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // Solo la esfera negra del horizonte de sucesos — sin el aro/aura brillante
        // que generaba el "stroke" alrededor del círculo.
        const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const bhGeo = new THREE.SphereGeometry(4, 64, 64);
        coreGroup.add(new THREE.Mesh(bhGeo, bhMat));

        const instanceCount = 1800;
        const streakGeo = new THREE.CylinderGeometry(0.01, 0.12, 2.2, 3);
        streakGeo.rotateX(Math.PI / 2);

        const diskMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMorph: { value: 0.1 },
                uCompression: { value: 1.0 },
                uIntensity: { value: 1.0 },
                uOrbitScale: { value: 1.0 }
            },
            vertexShader: `
            ${noiseChunk}
            uniform float uTime;
            uniform float uMorph;
            uniform float uCompression;
            uniform float uIntensity;
            uniform float uOrbitScale;
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                float rOriginal = length(instPos.xz);
                float r = rOriginal * uCompression;
                float initialAngle = atan(instPos.z, instPos.x);
                float orbitalVelocity = (1.5 / sqrt(rOriginal)) * uOrbitScale;
                float currentAngle = initialAngle + (uTime * orbitalVelocity);
                vec3 morphedWorldPos = vec3(cos(currentAngle) * r, instPos.y, sin(currentAngle) * r);
                float noise = snoise(vec3(morphedWorldPos.x * 0.08, morphedWorldPos.z * 0.08, uTime * 0.3));
                morphedWorldPos.y += noise * uMorph * 4.0;
                vec3 viewDir = normalize(cameraPosition - morphedWorldPos);
                vec3 orbitDir = normalize(vec3(-sin(currentAngle), 0.0, cos(currentAngle)));
                float doppler = dot(orbitDir, viewDir);
                // paleta Immoral: gris y azul, sin naranjas/rojos
                vec3 hot = vec3(0.88, 0.90, 0.93);
                vec3 warm = vec3(0.5, 0.56, 0.66);
                vec3 cool = vec3(0.18, 0.5, 0.93);
                vec3 color = mix(cool, warm, smoothstep(45.0, 12.0, r));
                color = mix(color, hot, smoothstep(10.0, 4.0, r));
                vColor = color * (1.3 + doppler * 0.7) * uIntensity;
                vOpacity = (smoothstep(3.8, 5.5, r) * (1.0 - smoothstep(38.0, 48.0, r))) * 0.8;
                float deltaAngle = currentAngle - initialAngle;
                float c = cos(deltaAngle);
                float s = sin(deltaAngle);
                mat3 rotY = mat3(
                    c, 0, s,
                    0, 1, 0,
                   -s, 0, c
                );
                vec3 localPos = (instanceMatrix * vec4(position, 0.0)).xyz;
                vec3 rotatedLocalPos = rotY * localPos;
                gl_Position = projectionMatrix * viewMatrix * vec4(morphedWorldPos + rotatedLocalPos, 1.0);
            }
        `,
            fragmentShader: `
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                gl_FragColor = vec4(vColor, vOpacity);
            }
        `,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });

        const instancedDisk = new THREE.InstancedMesh(streakGeo, diskMaterial, instanceCount);
        const dummy = new THREE.Object3D();

        for (let i = 0; i < instanceCount; i++) {
            // exponent < 1 (sqrt-like) spreads points toward a uniform-area disk instead of
            // piling them up near the event horizon, so it doesn't look packed right at the edge.
            const r = 6.5 + Math.pow(Math.random(), 0.55) * 38.5;
            const angle = Math.random() * Math.PI * 2;
            dummy.position.set(Math.cos(angle) * r, (Math.random() - 0.5) * (8 / r), Math.sin(angle) * r);
            dummy.lookAt(dummy.position.x + Math.sin(angle), dummy.position.y, dummy.position.z - Math.cos(angle));
            dummy.updateMatrix();
            instancedDisk.setMatrixAt(i, dummy.matrix);
        }
        scene.add(instancedDisk);

        // Solo la fase "Nominal" — sin ciclo automático de transición entre estados.

        // ---- Máscara de brillo: como el hero de Spline — el fondo se ve apagado
        // en todos lados y solo se ilumina, en tiempo real y con suavizado (sin dejar
        // rastro), la zona cerca del cursor. Se redibuja cada frame, nunca se acumula. ----
        const maskCanvas = document.getElementById('reveal-mask');
        const maskCtx = maskCanvas.getContext('2d');
        const GLOW_RADIUS = 260;
        const BASE_DIM = 0.9; // qué tan apagado se ve el fondo lejos del cursor
        const FOLLOW_EASE = 0.08; // suavizado del brillo siguiendo al cursor

        function resizeMask() {
            maskCanvas.width = window.innerWidth;
            maskCanvas.height = window.innerHeight;
        }
        resizeMask();

        const liveMouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const glowPos = { x: liveMouse.x, y: liveMouse.y };
        let hasMouse = false;
        let isHovering = false;
        let currentRadius = GLOW_RADIUS;
        const GLOW_RADIUS_HOVER = GLOW_RADIUS * 1.6; // la zona revelada crece de verdad al pasar el mouse

        window.addEventListener('pointermove', (e) => {
            liveMouse.x = e.clientX;
            liveMouse.y = e.clientY;
            hasMouse = true;
        });

        // leve zoom de toda la escena + la zona de luz crece mientras el mouse está encima
        document.body.addEventListener('mouseenter', () => {
            document.body.classList.add('is-hover');
            isHovering = true;
        });
        document.body.addEventListener('mouseleave', () => {
            document.body.classList.remove('is-hover');
            isHovering = false;
        });

        function drawMask() {
            glowPos.x += (liveMouse.x - glowPos.x) * FOLLOW_EASE;
            glowPos.y += (liveMouse.y - glowPos.y) * FOLLOW_EASE;
            const targetRadius = isHovering ? GLOW_RADIUS_HOVER : GLOW_RADIUS;
            currentRadius += (targetRadius - currentRadius) * 0.06;

            const w = maskCanvas.width, h = maskCanvas.height;
            // clear first — otherwise repeated source-over fills compound alpha toward
            // fully opaque frame after frame instead of staying at a flat BASE_DIM.
            maskCtx.clearRect(0, 0, w, h);
            maskCtx.globalCompositeOperation = 'source-over';
            maskCtx.fillStyle = `rgba(1,1,3,${BASE_DIM})`;
            maskCtx.fillRect(0, 0, w, h);

            if (!hasMouse) return;
            // destination-out removes dest_alpha * source_alpha — so the source needs to
            // reach ~1 at the center to actually punch through to a full reveal there.
            maskCtx.globalCompositeOperation = 'destination-out';
            const g = maskCtx.createRadialGradient(glowPos.x, glowPos.y, 0, glowPos.x, glowPos.y, currentRadius);
            g.addColorStop(0, 'rgba(0,0,0,1)');
            g.addColorStop(0.6, 'rgba(0,0,0,0.55)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            maskCtx.fillStyle = g;
            maskCtx.beginPath();
            maskCtx.arc(glowPos.x, glowPos.y, currentRadius, 0, Math.PI * 2);
            maskCtx.fill();
        }

        const clock = new THREE.Clock();
        function animate() {
            const time = clock.getElapsedTime();
            diskMaterial.uniforms.uTime.value = time;
            instancedDisk.rotation.y += 0.0005;
            controls.update();
            renderer.render(scene, camera);
            drawMask();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeMask();
        });

        animate();
    </script>
</body>

</html>
