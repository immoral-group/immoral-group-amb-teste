<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototipo - Hex Grid 3D</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #hex-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #hex-canvas:active {
            cursor: grabbing;
        }

        .label {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            opacity: 0.6;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="label">Prototipo aislado &mdash; arrastra con el mouse para girar</div>
    <canvas id="hex-canvas"></canvas>
    <script type="module" src="/src/hexgrid-prototype.js"></script>
</body>

</html>
